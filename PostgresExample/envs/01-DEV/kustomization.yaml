apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: template01-dev

labels:
- includeSelectors: true
  pairs:
    env: DEV

resources:
# Observability components
- ../../base/otel-collector
- ../../base/prometheus
- ../../base/grafana
# Databases
- ../../base/postgres
# Domain services

images:
- name: otel/opentelemetry-collector-contrib
  newTag: "0.142.0"
- name: prom/prometheus
  newTag: "v3.8.1"
- name: grafana/grafana
  newTag: "12.3.1"
- name: postgres
  newTag: "18.1-trixie"
- name: prometheuscommunity/postgres-exporter
  newTag: "v0.18.1"
