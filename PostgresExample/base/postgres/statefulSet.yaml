apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  labels:
    tier: database

spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres
        imagePullPolicy: IfNotPresent
        ports:
        - name: db
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: budget
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/
        resources:
          requests:
            memory: "128M"
            cpu: "50m"
          limits:
            memory: "512M"
            cpu: "250m"
      initContainers:
      - name: init-db
        image: postgres
        command: [ "psql", "postgresql://postgres:postgres@postgresql", "-f", "/init/00-createRoles.sql", "-f", "/init/01-createDatabase.sql"]
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: budget
        volumeMounts:
        - name: init-folder
          mountPath: /init
        - name: postgres-data
          mountPath: /var/lib/postgresql/

      volumes:
      - name: init-folder
        configMap:
          name: postgres-init
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-volume-claim
