apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  labels:
    tier: database

spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres
        imagePullPolicy: IfNotPresent
        ports:
        - name: db
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: budget
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/
        resources:
          requests:
            memory: "128M"
            cpu: "50m"
          limits:
            memory: "512M"
            cpu: "250m"
      initContainers:
      - name: init-db
        image: postgres
        command:
        - /bin/sh
        - -c
        - |
          while ! (pg_isready -U  $POSTGRES_USER);
          do
            echo "Database engine is not ready"
            sleep 1
          done
          echo Seeding database $POSTGRES_DB
          for f in /init/*.sql;
          do
            echo "Applying SQL file: $f"
            psql -U $POSTGRES_USER -d $POSTGRES_DB -f "$f"
          done
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: budget
        volumeMounts:
        - name: init-folder
          mountPath: /init
        - name: postgres-data
          mountPath: /var/lib/postgresql/

      volumes:
      - name: init-folder
        configMap:
          name: postgres-init
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-volume-claim
