apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  labels:
    tier: database

spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 125
        runAsGroup: 125
        fsGroup: 125

      containers:
      - name: postgres
        image: postgres
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
        ports:
        - name: db
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: budget
        volumeMounts:
        - name: init-folder
          mountPath: /docker-entrypoint-initdb.d
        - name: postgres-data
          mountPath: /var/lib/postgresql/
        startupProbe:
          exec:
            command: [ "pg_isready", "-U", "$POSTGRES_USER" ]
        readinessProbe:
          exec:
            command: [ "pg_isready", "-U", "$POSTGRES_USER" ]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [ "pg_isready", "-U", "$POSTGRES_USER" ]
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128M"
            cpu: "50m"
          limits:
            memory: "512M"
            cpu: "250m"

      volumes:
      - name: init-folder
        configMap:
          name: postgres-init
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-volume-claim
