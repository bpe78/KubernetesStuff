apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  labels:
    tier: database

spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres
        imagePullPolicy: IfNotPresent
        ports:
        - name: db
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        volumeMounts:
#        - name: postgres-config
#          mountPath: /etc/postgresql
        - name: postgres-data
          mountPath: /var/lib/postgresql/
        resources:
          requests:
            memory: "128M"
            cpu: "50m"
          limits:
            memory: "512M"
            cpu: "250m"
      # initContainers:
      # - name: init-createdb
      #   image: postgres
      #   command: ["psql", "postgresql://postgres:postgres@postgresql", "-f", "/etc/rsalbums/create_database.sql"]
      #   volumeMounts:
      #   - name: postgres-data
      #     mountPath: /var/lib/postgresql/18/data
      # - name: init-populatedb
      #   image: postgres
      #   command: ["psql", "postgresql://postgres:postgres@postgresql/foods", "-c", "\\copy food FROM '/etc/rsalbums/fooddisplaytable.csv' CSV HEADER;"]
      #   volumeMounts:
      #   - name: postgres-data
      #     mountPath: /var/lib/postgresql/18/data

      volumes:
#      - name: postgres-config 
#        configMap:
#          name: postgres-config
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-volume-claim
