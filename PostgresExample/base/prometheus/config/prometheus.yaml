global:
  scrape_interval: 10s
  evaluation_interval: 10s
  #scrape_timeout: 30s

scrape_configs:
- job_name: 'prometheus'
  static_configs:
  - targets: ['localhost:9090']
- job_name: 'otel-collector'
  honor_labels: true
  honor_timestamps: true
  metrics_path: /metrics
  static_configs:
  - targets: ['otel-collector:8889']
