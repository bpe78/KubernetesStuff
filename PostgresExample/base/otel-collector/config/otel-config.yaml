extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: 'postgres'
        scrape_interval: 10s
        static_configs:
        - targets: [ 'postgres:9187' ]
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: [ '0.0.0.0:8888' ]
        metric_relabel_configs:
        - source_labels: [ __name__ ]
          regex: '.*grpc_io.*'
          action: drop
  # Data sources: metrics
  hostmetrics:
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      process:
      processes:
      paging:

exporters:
  otlp:
    endpoint: '0.0.0.0:4317'
    tls:
      insecure: true
    sending_queue:
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true

  debug:

  # Data sources: metrics
  prometheus:
    endpoint: '0.0.0.0:8889'
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true  # Converts resource attributes to metric labels (see explanation below)    

processors:
  memory_limiter:
    limit_mib: 256
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 25

  batch:
    send_batch_size: 1024
    timeout: 1s

service:
  extensions:
  - health_check
  pipelines:
    metrics:
      receivers: [ otlp, prometheus, hostmetrics ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp, debug, prometheus ]
