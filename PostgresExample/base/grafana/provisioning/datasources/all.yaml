# # config file version
apiVersion: 1

# # list of datasources that should be deleted from the database
deleteDatasources:

# # list of datasources to insert/update depending
datasources:
- name: 'prometheus'
  type: 'prometheus'
  access: 'proxy'
  org_id: 1
  url: 'http://prometheus:9090'
  is_default: true
  editable: true
  version: 1
